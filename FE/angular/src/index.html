<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoicemeterAlt</title>
  <!--
    Relative base href (FE-064) so asset URLs resolve correctly regardless
    of which port the .NET host happens to bind to or whether the SPA is
    served from a sub-path. Angular's router still resolves correctly off
    a relative base; deep-link refreshes hit the SPA fallback in StaticFiles.cs.
  -->
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
